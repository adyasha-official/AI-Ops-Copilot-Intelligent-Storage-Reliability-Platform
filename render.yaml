# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: ai-ops-copilot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ops-db
          property: connectionString
      - key: ANTHROPIC_API_KEY   # optional; leave empty for the built-in rule-based answers
        sync: false

databases:
  - name: ops-db
    plan: free
